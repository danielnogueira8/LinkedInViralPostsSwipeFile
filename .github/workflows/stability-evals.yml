name: stability-evals

# NIGHTLY stability gate — the live-model eval tier run on a schedule so the
# SYSTEM catches a behavioral regression (em-dash creep, over-asking, format
# drift, voice) BEFORE a user does. Unlike the hermetic `evals` workflow (which
# stubs the model and runs on every push), this hits the REAL chat model (GLM
# via OpenRouter) + a real LLM judge (Claude), so it's gated to a schedule +
# manual trigger only — it burns API tokens and must not run per-push.
#
# Stability = PASS RATE across N runs per case, not a single green (see
# evals/live/stability-gate.live.test.ts + repeatEval in evals/live/harness.ts).
#
# CRITICAL: this job FAILS LOUDLY if the API-key secrets are missing, rather
# than skipping. The harness's shouldRunLiveEvals() skips cleanly with no keys
# (correct for local dev), but in CI a silent skip would let the gate rot — a
# green check that tested nothing. The preflight step below enforces real keys.

on:
  schedule:
    # 07:00 UTC daily (~2-3am US). Cron is UTC; GitHub may delay under load.
    - cron: "0 7 * * *"
  # Manual trigger from the Actions tab (run before/after a prompt/model change).
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per case (pass-rate sample size)"
        required: false
        default: "5"
      threshold:
        description: "Min pass rate to consider a case stable (0-1)"
        required: false
        default: "0.8"

# Only one stability run at a time — they make paid calls; no point stacking.
concurrency:
  group: stability-evals
  cancel-in-progress: false

jobs:
  stability:
    name: Live stability gate
    runs-on: ubuntu-latest
    # Repeat-run live evals are slow (N model+judge round-trips per case).
    timeout-minutes: 45

    env:
      RUN_LIVE_EVALS: "1"
      # Test PRODUCTION behavior: the decision pre-pass is on in prod, so the
      # gate must exercise it too.
      AGENT_DECISION_LAYER: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STABILITY_RUNS: ${{ github.event.inputs.runs || '5' }}
      STABILITY_THRESHOLD: ${{ github.event.inputs.threshold || '0.8' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — require API keys (fail, don't skip)
        run: |
          missing=""
          [ -z "$OPENROUTER_API_KEY" ] && missing="$missing OPENROUTER_API_KEY"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing — the stability gate cannot run. Add them under Settings → Secrets and variables → Actions. (Failing instead of skipping so the gate can't silently rot.)"
            exit 1
          fi
          echo "Keys present. Running $STABILITY_RUNS runs/case at threshold $STABILITY_THRESHOLD."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run live stability gate
        id: stability
        run: npm run test:evals:live

      - name: Notify on failure
        # Always attempt on failure; the script no-ops if no webhook secret is
        # set (the failed job is still visible in the Actions tab + GitHub's
        # default failed-run email). Configure secrets.STABILITY_ALERT_WEBHOOK
        # with a Slack/Discord incoming-webhook URL to get a ping.
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STABILITY_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No STABILITY_ALERT_WEBHOOK secret set — skipping notification (the failed run is still in the Actions tab)."
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: SwipeIn stability gate FAILED — a behavior dropped below the pass-rate threshold. ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL" || echo "Webhook post failed (non-fatal)."
