name: evals

# Runs the deterministic eval suite on every PR and every push to main. The
# suite uses stubbed dependencies, so it's free, fast, and catches the focused
# bug classes we've shipped to production. Live-model evals were removed during
# the cowork unification plan and are not run here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manually triggering from the Actions tab.
  workflow_dispatch:

jobs:
  evals:
    name: Deterministic invariants + focused coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install PostgreSQL migration test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          postgres_bin="$(pg_config --bindir)"
          test -x "$postgres_bin/initdb"
          test -x "$postgres_bin/pg_ctl"
          test -x "$postgres_bin/psql"
          echo "$postgres_bin" >> "$GITHUB_PATH"

      - name: Validate migration chain and metadata
        run: npm run migrations:check

      - name: Run eval suite with coverage summary
        run: npm run test:coverage

      - name: Publish deterministic gate context
        if: always()
        run: |
          echo "### Deterministic quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Vitest reports the violated invariant by test name. Focused policy: docs/testing/focused-coverage.json." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 30
