name: evals

# Runs the deterministic agent-loop eval suite on every PR and every push to
# main. The suite stubs the model + tool dispatch, so it's free, fast, and
# catches the bug classes we've shipped to production (empty turn, raw fence
# leak, in-band error mishandling, blank artifact). Live-model evals are a
# separate tier — not run here, since they'd burn API tokens on every push.
#
# See evals/golden-tasks.test.ts for the scenarios + evals/assertions.ts for
# the six core assertion helpers.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manually triggering from the Actions tab.
  workflow_dispatch:

jobs:
  evals:
    name: Golden agent-loop evals
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run eval suite with coverage summary
        run: npm run test:coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 30
